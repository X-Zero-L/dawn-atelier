name: Build Windows desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Attach the Windows package to a GitHub Release
        type: boolean
        default: false
      release_tag:
        description: Release tag (blank uses the version in version.json)
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Set up 64-bit Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
            requirements-build.txt
      - name: Resolve and validate the release version
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath version.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:REF_NAME } elseif ($env:REQUESTED_TAG) { $env:REQUESTED_TAG } else { "v$version" }
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $tag -ne "v$version") {
            throw 'The release tag must match version.json exactly.'
          }
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "tag=$tag"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "version=$version"
      - name: Build the desktop package
        env:
          PYTHONUTF8: '1'
          DAWN_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: pwsh
        run: python scripts/build-windows.py --expected-version $env:DAWN_RELEASE_TAG
      - name: Check compatibility and save operations on synthetic fixtures
        shell: pwsh
        run: python -X utf8 -m unittest discover -s tests -v
      - name: Keep package and build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dawn-atelier-${{ steps.release.outputs.version }}-windows-build
          if-no-files-found: warn
          retention-days: 30
          path: |
            dist/windows/
            .build/windows/pyinstaller.log
            .build/windows/pyinstaller/windows/warn-windows.txt
      - name: Publish the Windows download
        if: success() && (github.event_name == 'push' || inputs.publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DAWN_RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DAWN_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SOURCE_SHA: ${{ github.sha }}
        shell: pwsh
        run: |
          $tag = $env:DAWN_RELEASE_TAG
          $base = "DawnAtelier-$env:DAWN_VERSION-windows-x64"
          $files = @(
            "dist/windows/$base.zip",
            "dist/windows/$base.sha256",
            "dist/windows/$base.manifest.json",
            "dist/windows/$base.dependencies.json",
            'dist/windows/SHA256SUMS-windows.txt'
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release artifact: $file" }
          }
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = @"
          ## Windows 桌面版

          下载 **$base.zip**，解压后双击 **DawnAtelier.exe** 即可打开黎明工坊，无需安装 Python。

          - 独立窗口，首次打开可选择《黎明门前的吹笛人》安装目录并准备资料。
          - 一键超级补给、炼金沉淀物调整、NPC 好感与农具升级。
          - 保存前查看修改清单，自动备份原档；也可先进入演示模式。

          需要 Windows 10 / 11 64 位和 Microsoft Edge WebView2 Runtime。已核对游戏资源版本 **2026-09-29-717**、**2026-09-28-1042** 和 **2026-09-25-1016**；兼容补丁可在重新准备后继续使用。

          请完整解压文件夹，并保留 DawnAtelier.exe 旁边的 _internal 文件夹。
          "@
            $notesPath = Join-Path $env:RUNNER_TEMP 'dawn-windows-release.md'
            Set-Content -LiteralPath $notesPath -Value $notes -Encoding utf8
            gh release create $tag --target $env:RELEASE_SOURCE_SHA --title "黎明工坊 $tag · Windows 桌面版" --notes-file $notesPath --latest
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release.' }
          }
          $existing = gh release view $tag --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing release assets.' }
          $names = @($existing.assets | ForEach-Object { $_.name })
          $expected = @($files | ForEach-Object { Split-Path -Leaf $_ })
          $present = @($expected | Where-Object { $names -contains $_ })
          if ($present.Count -eq $expected.Count) {
            Write-Output 'The verified Windows download is already attached; preserving published checksums.'
            exit 0
          }
          if ($present.Count -ne 0) { throw 'Windows release assets are incomplete; refusing to overwrite existing checksums.' }
          gh release upload $tag @files
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload the Windows package.' }
          Write-Output "Published $base.zip to $tag"
